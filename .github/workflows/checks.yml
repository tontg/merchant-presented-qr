name: Static application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node tools/audit.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/emvqr-tests" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/emvqr-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression checks
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/emvqr-tests/node_modules/playwright/index.mjs" node tests/browser.mjs
